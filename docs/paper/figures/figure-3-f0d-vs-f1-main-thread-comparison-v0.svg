<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Figure 3. F0-D vs F1 Main-thread Comparison</title>
  <desc id="desc">Two-panel comparison of F0-D main-thread derived fanout and F1 Worker offload, showing main-thread long task reduction while preserving equivalent structural work.</desc>

  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="760" fill="#ffffff"/>

  <text x="700" y="40" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#111827">Figure 3. F0-D vs F1 Main-thread Comparison</text>
  <text x="700" y="70" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#4b5563">F1 does not eliminate equivalent derived fanout; it moves the heavy work off the main thread and keeps the visible update bounded.</text>

  <rect x="50" y="105" width="625" height="515" rx="14" fill="#fafafa" stroke="#d1d5db" stroke-width="2"/>
  <rect x="725" y="105" width="625" height="515" rx="14" fill="#fafafa" stroke="#d1d5db" stroke-width="2"/>

  <text x="362.5" y="140" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#111827">F0-D: Main-thread derived fanout</text>
  <text x="1037.5" y="140" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#111827">F1: Worker offload</text>

  <rect x="88" y="165" width="548" height="210" rx="12" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4"/>
  <rect x="112" y="182" width="500" height="30" rx="7" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="362" y="202" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#374151">Main Thread lane owns fanout work</text>

  <rect x="120" y="235" width="92" height="46" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="166" y="254" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111827">Synthetic</text>
  <text x="166" y="271" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111827">click</text>

  <line x1="212" y1="258" x2="251" y2="258" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <rect x="252" y="235" width="120" height="46" rx="8" fill="#fff7ed" stroke="#b45309"/>
  <text x="312" y="254" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111827">Run</text>
  <text x="312" y="271" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111827">Microtasks</text>

  <line x1="372" y1="258" x2="411" y2="258" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <rect x="412" y="235" width="122" height="46" rx="8" fill="#fff7ed" stroke="#b45309"/>
  <text x="473" y="254" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111827">target</text>
  <text x="473" y="271" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111827">FunctionCall</text>

  <line x1="473" y1="281" x2="473" y2="310" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <rect x="222" y="311" width="330" height="44" rx="8" fill="#fef2f2" stroke="#991b1b"/>
  <text x="387" y="329" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#111827">module/subscriber derived fanout</text>
  <text x="387" y="347" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">microtask/flush dominated</text>

  <text x="92" y="410" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#374151">Main-thread max task</text>
  <line x1="92" y1="438" x2="618" y2="438" stroke="#e5e7eb" stroke-width="8" stroke-linecap="round"/>
  <rect x="92" y="423" width="468" height="30" rx="15" fill="#fee2e2" stroke="#991b1b"/>
  <text x="326" y="443" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#7f1d1d">≈68.633ms main-thread long task</text>

  <rect x="92" y="474" width="238" height="76" rx="10" fill="#ffffff" stroke="#d1d5db"/>
  <text x="110" y="498" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#111827">f0_run_task_max_ms</text>
  <text x="110" y="522" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#7f1d1d">mean ≈ 68.633ms</text>

  <rect x="346" y="474" width="238" height="76" rx="10" fill="#ffffff" stroke="#d1d5db"/>
  <text x="364" y="498" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#111827">f0_microtask_window_ms</text>
  <text x="364" y="522" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#7f1d1d">mean ≈ 66.987ms</text>

  <rect x="92" y="564" width="492" height="34" rx="8" fill="#fef2f2" stroke="#991b1b" stroke-width="1.2"/>
  <text x="110" y="586" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#7f1d1d">long_task_count_50ms = 1/run</text>
  <text x="346" y="586" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#4b5563">main thread owns fanout work</text>

  <rect x="763" y="165" width="548" height="210" rx="12" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4"/>
  <rect x="787" y="182" width="230" height="30" rx="7" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="902" y="202" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#374151">Main Thread lane</text>

  <rect x="1045" y="182" width="230" height="30" rx="7" fill="#eef2f7" stroke="#cbd5e1"/>
  <text x="1160" y="202" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#334155">Worker lane</text>
  <line x1="1031" y1="176" x2="1031" y2="360" stroke="#9ca3af" stroke-width="1.3" stroke-dasharray="8 8"/>

  <rect x="795" y="235" width="102" height="46" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="846" y="254" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111827">Synthetic</text>
  <text x="846" y="271" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111827">click</text>

  <line x1="897" y1="258" x2="938" y2="258" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <rect x="939" y="235" width="96" height="46" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="987" y="254" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111827">dispatch</text>
  <text x="987" y="271" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111827">to Worker</text>

  <line x1="1035" y1="258" x2="1074" y2="258" stroke="#334155" stroke-width="2" marker-end="url(#arrow-dark)"/>
  <rect x="1075" y="235" width="190" height="54" rx="8" fill="#eef6ff" stroke="#475569"/>
  <text x="1170" y="256" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#111827">Worker compute</text>
  <text x="1170" y="275" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">equivalent derived fanout</text>

  <path d="M 1170 289 C 1170 330, 988 333, 988 306" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow-dark)"/>
  <rect x="875" y="306" width="226" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="988" y="324" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#111827">bounded main visible update</text>
  <text x="988" y="342" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">presentation remains on main thread</text>

  <text x="767" y="410" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#374151">Main-thread max task</text>
  <line x1="767" y1="438" x2="1293" y2="438" stroke="#e5e7eb" stroke-width="8" stroke-linecap="round"/>
  <rect x="767" y="423" width="46" height="30" rx="15" fill="#dcfce7" stroke="#166534"/>
  <text x="832" y="443" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#14532d">≈2.679ms</text>

  <text x="767" y="486" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#374151">Worker compute path</text>
  <line x1="767" y1="514" x2="1293" y2="514" stroke="#e5e7eb" stroke-width="8" stroke-linecap="round"/>
  <rect x="767" y="499" width="350" height="30" rx="15" fill="#dbeafe" stroke="#475569"/>
  <text x="942" y="519" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">Worker compute mean ≈51.367ms</text>

  <rect x="767" y="548" width="252" height="48" rx="10" fill="#ffffff" stroke="#d1d5db"/>
  <text x="785" y="570" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#111827">Worker roundtrip mean</text>
  <text x="785" y="590" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#1e3a8a">≈55.433ms</text>

  <rect x="1038" y="548" width="252" height="48" rx="10" fill="#f0fdf4" stroke="#166534"/>
  <text x="1056" y="570" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#14532d">main-thread long task count</text>
  <text x="1056" y="590" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#14532d">0/run</text>

  <rect x="275" y="630" width="850" height="34" rx="9" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="700" y="652" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#374151">Structural work preserved by counters/checksum; not cycle-identical.</text>

  <rect x="70" y="680" width="1260" height="54" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="700" y="700" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#4b5563">Figure 3. F0-D reproduces an action-triggered, microtask-dominated main-thread long task in a controlled derived-fanout workload.</text>
  <text x="700" y="719" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#4b5563">F1 preserves equivalent structural work but moves the heavy derived-fanout path to a Worker, reducing main-thread max task time from ≈68.633ms to ≈2.679ms and eliminating 50ms+ main-thread long tasks in the controlled setting.</text>

  <text x="700" y="750" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">Controlled workload; not product replay; not production runtime.</text>
</svg>
